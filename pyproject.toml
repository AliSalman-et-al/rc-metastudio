[project]
name = "rc-metastudio"
version = "0.5.3"
description = "RC MetaStudio open-source desktop software for advanced meta-analysis."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Ali Salman and RC MetaStudio contributors", email = "alisalman.et.al@gmail.com" },
]
maintainers = [
    { name = "Ali Salman", email = "alisalman.et.al@gmail.com" },
]
dependencies = [
    "PyQt6==6.12.0",
    "jsonschema==4.26.0",
    "openpyxl==3.1.5",
    "pyinstaller==6.22.3",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "python-docx==1.2.0",
    "rpy2==3.6.9",
]

[project.scripts]
rc-metastudio = "rc_metastudio.__main__:main"

[project.urls]
Homepage = "https://github.com/AliSalman-et-al/rc-metastudio"
Issues = "https://github.com/AliSalman-et-al/rc-metastudio/issues"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rc_metastudio*"]

[tool.setuptools.package-data]
rc_metastudio = [
    "forms/*.ui",
    "images/**/*",
    "project_schemas/**/*.json",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "qsettings: tests that require isolated per-test QSettings storage.",
]

[dependency-groups]
dev = [
    "PyQt6-Pdf==6.140.0",
    "aqtinstall==3.3.0",
    "complexipy==9.0.0",
    "coverage==7.17.3",
    "grimp==3.19",
    "libcst==1.9.0",
    "matplotlib==3.11.2",
    "pefile==2024.8.26",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "py7zr==1.1.4",
    "pyside6-essentials==6.12.0 ; sys_platform == 'linux'",
    "pyyaml==6.0.3",
    "radon==6.0.1",
    "ty==0.0.102",
    "vulture==2.16",
]

[tool.ty.environment]
python-version = "3.14"
root = ["./src", ".", "./.agents/skills/verify-rcms/scripts"]

[tool.ty.src]
exclude = ["build", "src/rc_metastudio/forms/ui_*.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.vulture]
paths = [
    "src",
    "scripts",
    "tests",
    ".agents/skills/verify-rcms/scripts",
    "r/RCMetaR/inst/qa",
]
min_confidence = 60
sort_by_size = true

[tool.ruff.lint.per-file-ignores]
"src/rc_metastudio/analysis_dataset.py" = ["E402"]
"src/rc_metastudio/launch.py" = ["E402"]
"src/rc_metastudio/r_bridge.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.coverage.run]
source = ["rc_metastudio"]
branch = true
parallel = true
patch = ["subprocess"]
omit = ["*/forms/ui_*.py", "*/generated/rc_metastudio/ui_*.py"]

[tool.coverage.report]
omit = ["*/forms/ui_*.py", "*/generated/rc_metastudio/ui_*.py"]
