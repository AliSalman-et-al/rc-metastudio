name: Withdraw Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag to withdraw without deleting evidence.
        required: true
        type: string
      superseded_by:
        description: Last-known-good or replacement tag.
        required: true
        type: string
      reason:
        description: Public withdrawal reason.
        required: true
        type: string

permissions:
  contents: read

jobs:
  withdraw:
    runs-on: ubuntu-latest
    environment: production-release
    concurrency: withdraw-${{ inputs.tag }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Track withdrawal before marking release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SUPERSEDED_BY: ${{ inputs.superseded_by }}
          REASON: ${{ inputs.reason }}
        run: node scripts/release_actions.cjs withdraw
