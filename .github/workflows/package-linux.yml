name: Package Linux x86_64

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: RCMetaStudio Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.11.9
      - name: Install Linux package build and qualification libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 librsvg2-2 libdeflate-dev libzstd-dev libtirpc-dev liblzma-dev libbz2-dev libblas-dev liblapack-dev libgfortran5 libgomp1 libtk8.6
      - name: Build and qualify the portable Linux package
        shell: bash
        run: bash scripts/package-linux.sh
      - name: Upload package and qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-linux-x64
          path: |
            artifacts/RCMetaStudio-linux-x64.tar.gz
            artifacts/RCMetaStudio-linux-x64-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Replay trusted carry smoke environment with project-format trace
        shell: bash
        run: |
          set -euo pipefail
          smoke_root=build/linux-package/work/carry-replay
          diagnostics="$PWD/$smoke_root/diagnostics"
          mkdir -p "$smoke_root/tree" "$diagnostics"
          tar -xzf artifacts/RCMetaStudio-linux-x64.tar.gz -C "$smoke_root/tree"
          root="$(find "$smoke_root/tree" -mindepth 1 -maxdepth 1 -type d -name 'RCMetaStudio-linux-x64' -print -quit)"
          launcher="$root/LaunchRCMetaStudio.sh"
          sample="$(find "$root" -path '*/sample_projects/amino.rcms' -print -quit)"
          runtime_probe="$(find "$root" -path '*/qualification/runtime-probe.json' -print -quit)"
          python_exe="$(uv python find 3.11.9)"
          test -n "$root" && test -x "$launcher" && test -n "$sample" && test -n "$runtime_probe"
          env -u LD_LIBRARY_PATH -u QT_QPA_PLATFORM -u RCMS_PACKAGE_SMOKE_EVIDENCE \
            RCMS_REQUIRE_IN_PROCESS_RPY2=1 RPY2_CFFI_MODE=API \
            RCMS_AUTOMATION_SMOKE_LOG="$diagnostics/packaged-smoke.log" \
            RCMS_AUTOMATION_HANG_TRACE="$diagnostics/packaged-smoke.hang-trace.log" \
            xvfb-run -a env PATH="$root/R/bin" PYTHONPATH="$PWD/src" "$python_exe" scripts/assemble_packaged_smoke_evidence.py \
              --workflow-observation "$diagnostics/workflow-observation.json" \
              --surface-records "$diagnostics/surface-records" \
              --sample-observations "$diagnostics/sample-observations.json" \
              --sample amino.rcms --sample-root "$(dirname "$sample")" \
              --sample-path "$sample" --executable "$launcher" \
              --runtime-probe "$runtime_probe" \
              --surface-directory "$diagnostics/surface-records" \
              --log-path "$diagnostics/packaged-smoke.log" \
              --output "$diagnostics/packaged-smoke.json" \
              > "$diagnostics/packaged-smoke.stdout.log" \
              2> "$diagnostics/packaged-smoke.stderr.log"
      - name: Upload trusted carry smoke trace
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-carry-smoke-trace
          path: build/linux-package/work/carry-replay/diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-linux-x64-diagnostics
          path: |
            artifacts/RCMetaStudio-linux-x64-*-evidence.json
            build/linux-package/**
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
