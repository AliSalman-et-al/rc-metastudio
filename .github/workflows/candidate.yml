name: Build Immutable Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: RC version to build, for example 0.4.0-rc.1.
        required: true
        type: string
      source_sha:
        description: Full protected-master commit SHA.
        required: true
        type: string
      trust_profile:
        description: Explicit artifact trust profile.
        required: true
        default: unsigned-community
        type: choice
        options:
          - unsigned-community
          - macos-trusted

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.version }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify source is protected master
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
      - name: Initialize three-target release set
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
          TRUST_PROFILE: ${{ inputs.trust_profile }}
        run: python scripts/delivery.py init --version "$VERSION" --commit "$SOURCE_SHA" --repository "$REPOSITORY" --trust-profile "$TRUST_PROFILE" --output candidate/release-set.json
      - name: Resolve candidate build targets
        id: targets
        run: |
          matrix="$(jq -c '{include: [.targets | to_entries[] | {
            target: .key, runner: .value.runner, architecture: .value.architecture,
            artifact: (.value.candidate_artifact // .value.artifact)
          }]}' delivery/targets.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-set-initial
          path: candidate/release-set.json
          if-no-files-found: error

  build:
    needs: initialize
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-set-initial
          path: candidate
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        if: hashFiles('.github/actions/setup-rcms/action.yml') == ''
        with:
          enable-cache: true
      - run: uv python install
        if: hashFiles('.github/actions/setup-rcms/action.yml') == ''
      - uses: ./.github/actions/setup-rcms
        if: hashFiles('.github/actions/setup-rcms/action.yml') != ''
        with:
          qt-rcc: 'true'
          linux-package-r-cache: ${{ matrix.target == 'linux-x64' }}
          macos-package-r-cache: ${{ matrix.target == 'macos-arm64' }}
      - name: Install Linux package build and qualification libraries
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          packages=(xvfb libegl1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 librsvg2-2 libdeflate-dev libzstd-dev libtirpc-dev liblzma-dev libbz2-dev libblas-dev liblapack-dev libgfortran5 libgomp1 libtk8.6)
          if ! sudo apt-get install -y "${packages[@]}"; then
            sudo apt-get -o Acquire::Languages=none update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Cache official Qt SDK for macOS
        if: startsWith(matrix.target, 'macos-') && hashFiles('.github/actions/setup-rcms/action.yml') == ''
        id: macos_qt_sdk_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt-sdk
          key: qtbase-sdk-6.12.0-${{ matrix.target }}
      - name: Install official Qt SDK for macOS
        if: startsWith(matrix.target, 'macos-') && hashFiles('.github/actions/setup-rcms/action.yml') == '' && steps.macos_qt_sdk_cache.outputs.cache-hit != 'true'
        shell: bash
        run: uv tool run --from aqtinstall==3.3.0 aqt install-qt mac desktop 6.12.0 clang_64 --archives qtbase --outputdir "$PWD/build/qt-sdk"
      - name: Resolve official Qt rcc for macOS
        if: startsWith(matrix.target, 'macos-') && hashFiles('.github/actions/setup-rcms/action.yml') == ''
        shell: bash
        run: |
          if [ -f scripts/macos_rcc.py ]; then
            resolver=(scripts/macos_rcc.py)
          else
            resolver=(scripts/qt6_macos_feasibility.py resolve-rcc)
          fi
          PYTHONPATH="$PWD/src" uv run --no-project python "${resolver[@]}" \
            --sdk-root "$PWD/build/qt-sdk/6.12.0/macos" \
            --github-env "$GITHUB_ENV" \
            --diagnostic "build/qt-sdk/${{ matrix.target }}-rcc.json"
      - name: Cache immutable official Windows R download
        if: matrix.target == 'windows-x64'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/download-cache/windows-x64
          key: official-r-4.6.2-windows-x64-B0B0053BAA1963B6D8A28C9642D50107EF9CE2F41C8B9A90E952846C8918B38A

      - name: Build Windows unsigned candidate
        if: matrix.target == 'windows-x64'
        shell: powershell
        run: .\scripts\package-windows.ps1
      - name: Fingerprint macOS Qt build inputs
        if: startsWith(matrix.target, 'macos-')
        id: macos-qt-build
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [ -f scripts/macos_build_cache.py ]; then
            uv run --no-project python scripts/macos_build_cache.py "$ARCHITECTURE"
          fi

      - name: Cache the source-built macOS Qt SDK
        if: steps.macos-qt-build.outputs.sdk != ''
        id: macos-qt-build-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/macos-qt-source/install
          key: macos-qt-sdk-${{ steps.macos-qt-build.outputs.sdk }}

      - name: Cache the source-built PyQt wheel
        if: steps.macos-qt-build.outputs.sdk != ''
        id: macos-pyqt-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/macos-pyqt-cache
          key: macos-pyqt-wheel-${{ steps.macos-qt-build.outputs.wheel }}

      - name: Require warm macOS build dependencies
        if: >-
          steps.macos-qt-build.outputs.sdk != '' &&
          (steps.macos-qt-build-cache.outputs.cache-hit != 'true' ||
          steps.macos-pyqt-cache.outputs.cache-hit != 'true')
        shell: bash
        run: |
          echo "::error::Run Package native macOS applications on master with prepare_dependencies_only enabled, then retry the candidate."
          exit 1

      - name: Build native macOS unsigned candidate
        if: startsWith(matrix.target, 'macos-')
        timeout-minutes: ${{ steps.macos-qt-build.outputs.sdk != '' && 14 || 160 }}
        shell: bash
        env:
          RCMS_RUNNER_LABEL: ${{ matrix.runner }}
          RCMS_MACOS_QT_CACHE_HIT: ${{ steps.macos-qt-build-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
          RCMS_MACOS_PYQT_CACHE: ${{ steps.macos-qt-build.outputs.wheel != '' }}
          RCMS_MACOS_REQUIRE_WARM_QT: ${{ steps.macos-qt-build.outputs.sdk != '' }}
          ARTIFACT: ${{ matrix.artifact }}
        run: bash scripts/package-macos.sh --architecture "${{ matrix.architecture }}" --artifact-name "${ARTIFACT%.zip}"
      - name: Prune the macOS build wheel cache
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          if [ -d build/macos-pyqt-cache ]; then
            uv cache prune --ci --cache-dir build/macos-pyqt-cache
          fi

      - name: Build native Linux unsigned candidate
        if: matrix.target == 'linux-x64'
        shell: bash
        run: bash scripts/package-linux.sh
      - name: Upload native macOS candidate diagnostics
        if: ${{ startsWith(matrix.target, 'macos-') && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.target }}-diagnostics
          path: |
            artifacts/RCMetaStudio-${{ matrix.target }}-evidence.json
            artifacts/RCMetaStudio-${{ matrix.target }}-archive-inspection.json
            build/macos-package/${{ matrix.architecture }}/work/qualification/**
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/warn-rc-metastudio-macos.txt
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/xref-rc-metastudio-macos.html
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Normalize authoritative package filename for the release set
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $builtArchives = @(Get-ChildItem artifacts -File -Filter 'RCMetaStudio-*-windows-x64.zip')
          if ($builtArchives.Count -ne 1) { throw "Expected exactly one versioned Windows package, found $($builtArchives.Count)." }
          $destination = Join-Path artifacts $env:ARTIFACT
          Move-Item -LiteralPath $builtArchives[0].FullName -Destination $destination
      - name: Check Linux package output
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          test -s "artifacts/$ARTIFACT"
      - name: Extract Windows candidate
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          Expand-Archive -LiteralPath "artifacts/$env:ARTIFACT" -DestinationPath candidate/tree
      - name: Extract macOS candidate
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p candidate/tree
          ditto -x -k "artifacts/$ARTIFACT" candidate/tree
      - name: Extract Linux candidate
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          mkdir -p candidate/tree
          tar -xzf "artifacts/$ARTIFACT" -C candidate/tree
      - name: Record assembled candidate
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          recorder=candidate/recorder
          mkdir -p "$recorder/scripts" "$recorder/delivery"
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:scripts/delivery.py" > "$recorder/scripts/delivery.py"
          cp delivery/targets.json "$recorder/delivery/targets.json"
          uv run --no-project python "$recorder/scripts/delivery.py" record-assembled --target "$TARGET" --archive "artifacts/$ARTIFACT" --manifest candidate/release-set.json --tree candidate/tree
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.target }}
          path: |
            artifacts/${{ matrix.artifact }}
            candidate/release-set.json
            candidate/${{ matrix.target }}.*.json
          if-no-files-found: error
          compression-level: 0

  candidate-gate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "All three candidate artifacts were built once and are ready for the selected trust-profile qualification."
