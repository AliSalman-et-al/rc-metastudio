name: Manual Package Qualification

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Qualify the Windows x64 package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos:
        description: Build the native Apple-silicon macOS package without publishing it.
        required: true
        default: true
        type: boolean
      build_linux:
        description: Build and qualify the Linux x86_64 portable package without publishing it.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-package-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    if: ${{ inputs.build_windows }}
    uses: ./.github/workflows/package-windows.yml

  macos-packages:
    if: ${{ inputs.build_macos }}
    uses: ./.github/workflows/package-target.yml

  linux-package:
    if: ${{ inputs.build_linux }}
    uses: ./.github/workflows/package-linux.yml
