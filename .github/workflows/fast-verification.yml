name: Qt6 Integration Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

env:
  RCMS_CRAN_REPO: https://packagemanager.posit.co/cran/2026-11-13

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-classifier:
    name: Qt6 Verification Change Classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.classify.outputs.lanes }}
      targets: ${{ steps.classify.outputs.targets }}
      r-stack-parts: ${{ steps.classify.outputs.r-stack-parts }}

    steps:
      - name: Check out classifier policy and comparison history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$PR_DRAFT" == true ]]; then
            options+=(--draft)
          fi
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              python3 -m scripts.package_input_policy --full "$EVENT_NAME" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BASE" ;;
          esac
          if [[ -z "$base" ]] || ! git cat-file -e "$base^{commit}"; then
            python3 -m scripts.package_input_policy "${options[@]}" --full "comparison base unavailable" >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only -z "$base" HEAD -- |
              python3 -m scripts.package_input_policy "${options[@]}" >> "$GITHUB_OUTPUT"
          fi

  code-health:
    name: Deterministic code-health baseline and gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Fetch pre-squash baseline
        id: baseline-source
        run: |
          set -euo pipefail
          sha="$(python3 -c 'from scripts.verify import STABLE_BASELINE; print(STABLE_BASELINE)')"
          git fetch origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rcms
      - run: uv sync --frozen --only-group dev --no-install-project
      - name: Cache fixed code-health baseline
        id: baseline-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            artifacts/code-health/baseline.json
            artifacts/code-health/baseline.txt
          key: code-health-baseline-${{ runner.os }}-${{ runner.arch }}-${{ steps.baseline-source.outputs.sha }}-${{ hashFiles('scripts/code_health.py', 'config/code-health.json', 'pyproject.toml', '.python-version', 'uv.lock') }}
      - name: Resolve comparison base
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD~1)"
          fi
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Enforce shared code-health gates
        env:
          COMPARISON_BASE: ${{ steps.base.outputs.sha }}
          BASELINE_CACHE_HIT: ${{ steps.baseline-cache.outputs.cache-hit }}
        run: >-
          uv run --no-sync python -c
          "from scripts.verify import run_code_health; import os;
          run_code_health(os.environ['COMPARISON_BASE'], os.environ['GITHUB_SHA'],
          reuse_baseline=os.environ['BASELINE_CACHE_HIT'] == 'true')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: code-health-${{ github.run_id }}
          path: artifacts/code-health
          if-no-files-found: error

  quick:
    name: Quick Verification
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms
        with:
          hosted-r: 'true'
          qt-rcc: 'true'

      - name: Run Windows quick checks
        run: uv run --locked python scripts/verify.py quick

      - name: Upload strict typing transcript
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quick-typing-win32
          path: artifacts/verification/typing
          if-no-files-found: warn
          retention-days: 14

  qt6-verification:
    name: Native Qt6 Vertical Slice
    needs: [change-classifier, code-health, quick]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'qt6-verification') }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms
        with:
          qt-rcc: 'true'

      - name: Run Native Qt6 Vertical Slice
        run: .\scripts\verify-qt6.ps1 -Sync -Section Core

      - name: Upload native calculator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-calculator-evidence
          path: build/qt6-verification/native-calculators
          if-no-files-found: warn
          retention-days: 14

  remaining-surface-verification:
    name: Native Qt6 Remaining Surfaces
    needs: [change-classifier, code-health, quick]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'remaining-surface-verification') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms
        with:
          qt-rcc: 'true'

      - name: Run remaining-surface verification on a fresh runner
        run: .\scripts\verify-qt6.ps1 -Sync -Section RemainingSurfaces

      - name: Upload native remaining-surface evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-remaining-surface-evidence
          path: build/qt6-verification/native-remaining-surfaces
          if-no-files-found: error
          retention-days: 14

  source-fast-targets:
    name: Source and Platform Verification (${{ matrix.target }})
    needs: [change-classifier, code-health, quick]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'source-fast-targets') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.change-classifier.outputs.targets) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms
        with:
          hosted-r: ${{ matrix.platform != 'linux' }}
          qt-rcc: 'true'

      - name: Cache Default R Evidence library
        if: ${{ matrix.platform == 'macos' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/r-default-library-cache
          key: r-default-evidence-v2-${{ matrix.target }}-r-4.6.2-public-ppm-2026-11-13-${{ hashFiles('scripts/install-r-deps.R', 'scripts/r_binary_policy.R', 'scripts/r_dependency_policy.py', 'scripts/r_verification_support.py', 'scripts/verify_rcmetar_r_default.py', 'config/r-dependencies.json', 'r/RCMetaR/DESCRIPTION') }}

      - name: Provision macOS native R build libraries
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          brew install libpng pkg-config
          libpng_prefix="$(brew --prefix libpng)"
          mkdir -p "$HOME/.R"
          printf 'CPPFLAGS += -I%s/include\nLDFLAGS += -L%s/lib\n' \
            "$libpng_prefix" "$libpng_prefix" >> "$HOME/.R/Makevars"
          echo "CPPFLAGS=-I$libpng_prefix/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$libpng_prefix/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$libpng_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      # Windows runs the shared Python and golden contracts. macOS validates
      # the installed R worker; Linux validates native xcb with R evidence skipped.
      - name: Run Platform-Neutral Python Verification
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: uv run --locked python scripts\verify.py fast --skip-r-evidence

      - name: Run Native Platform Smoke and R Evidence
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: uv run --locked python scripts/verify.py smoke --require-r-evidence

      - name: Run Linux Qt xcb and Python verification
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          xcb_packages=(xvfb libegl1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0)
          if ! sudo apt-get install -y "${xcb_packages[@]}"; then
            sudo apt-get update
            sudo apt-get install -y "${xcb_packages[@]}"
          fi
          uv sync --locked
          uv run --no-sync python -c "from scripts.verify import run_linux_source; run_linux_source()"

  windows-r-library:
    name: Prepare Windows pinned R library
    needs: [change-classifier, code-health]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'full-r-stack') || contains(fromJSON(needs.change-classifier.outputs.lanes), 'windows-package-qualification') }}
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rcms
        with:
          hosted-r: 'true'
      - name: Cache pinned R dependency library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/pinned-r/dependencies/library
          key: pinned-r-v2-windows-x64-4.6.2-${{ hashFiles('config/r-dependencies.json', 'scripts/install-r-deps.R', 'scripts/r_binary_policy.R', 'scripts/r_dependency_policy.py') }}
      - name: Cache RCMetaR source archive and installation
        id: rcmetar-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/pinned-r/source
          key: pinned-rcmetar-v2-windows-x64-4.6.2-${{ hashFiles('config/r-dependencies.json', 'scripts/install-rcmetar-source.R', 'r/RCMetaR/**') }}
      - name: Install and verify pinned binary dependencies
        run: |
          $env:R_LIBS_USER = (New-Item -ItemType Directory -Force build/pinned-r/dependencies/library).FullName
          $env:R_LIBS = $env:R_LIBS_USER
          $env:RCMS_POLICY_PYTHON = (uv python find --managed-python).Trim()
          Rscript scripts/install-r-deps.R
          exit $LASTEXITCODE
      - name: Build and install RCMetaR
        if: steps.rcmetar-cache.outputs.cache-hit != 'true'
        run: |
          $env:R_LIBS_USER = (Resolve-Path build/pinned-r/dependencies/library).Path
          $env:R_LIBS = $env:R_LIBS_USER
          $source = (Resolve-Path r/RCMetaR).Path
          $installer = (Resolve-Path scripts/install-rcmetar-source.R).Path
          $library = (New-Item -ItemType Directory -Force build/pinned-r/source).FullName
          Set-Location $library
          R.exe CMD build --no-build-vignettes $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-ChildItem -File -Filter 'RCMetaR_*.tar.gz'
          Rscript $installer $archive.FullName $library
          exit $LASTEXITCODE
      - name: Check the prepared RCMetaR layout
        run: |
          if (!(Test-Path -LiteralPath build/pinned-r/source/RCMetaR/DESCRIPTION -PathType Leaf) -or
              !(Get-ChildItem build/pinned-r/source -File -Filter 'RCMetaR_*.tar.gz')) {
              throw "Prepared RCMetaR library or source archive is missing."
          }
      - name: Publish the verified library for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-pinned-r-library
          path: build/pinned-r
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true

  full-r-stack:
    name: Required Windows Full R Stack Evidence (${{ matrix.part }})
    needs: [change-classifier, code-health, quick, windows-r-library]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'full-r-stack') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.change-classifier.outputs.r-stack-parts) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms
        with:
          hosted-r: 'true'
          qt-rcc: 'true'

      - name: Install PDF text verification tool
        if: ${{ matrix.part != 'checks' }}
        run: |
          choco install poppler --version=26.9.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Poppler installation failed." }
          $pdfTool = Get-ChildItem "$env:ChocolateyInstall/lib/poppler/tools" -Filter pdftotext.exe -Recurse | Select-Object -First 1
          if ($null -eq $pdfTool) { throw "Poppler pdftotext was not installed." }
          $pdfTool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$($pdfTool.DirectoryName);$env:Path"
          Get-Command pdftotext -ErrorAction Stop

      - name: Retrieve the verified R library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-pinned-r-library
          path: build/pinned-r

      - name: Run Full R Stack Evidence
        env:
          PART: ${{ matrix.part }}
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          $selection = @("--skip-desktop")
          if ($env:PART -ne "checks") { $selection = @("--desktop-shard", $env:PART) }
          if ($env:SCENARIOS) { $selection += @("--desktop-scenarios", $env:SCENARIOS) }
          uv run --locked python scripts/verify_rcmetar_r_stack.py --prepared-r-library build/pinned-r @selection

      - name: Upload Full R Stack evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-r-stack-windows-${{ matrix.part }}-evidence
          path: artifacts/verification
          if-no-files-found: warn
          retention-days: 14

      - name: Upload strict golden capture
        if: ${{ always() && matrix.part == 'checks' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-r-stack-windows-golden-capture
          path: build/qt6-verification/golden-compatibility-r-stack-v2
          if-no-files-found: warn
          retention-days: 14

  windows-package-qualification:
    name: Required Windows x64 Package Qualification
    needs: [change-classifier, code-health, quick, windows-r-library]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'windows-package-qualification') }}
    uses: ./.github/workflows/package-windows.yml
    with:
      prepared-r-library: true

  macos-package-qualification:
    name: Required macOS arm64 Package Qualification
    needs: [change-classifier, code-health, quick]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'macos-package-qualification') }}
    uses: ./.github/workflows/package-target.yml
    with:
      pr_wheels: ${{ github.event_name == 'pull_request' }}

  linux-package-qualification:
    name: Required Linux x64 Package Qualification
    needs: [change-classifier, code-health, quick]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'linux-package-qualification') }}
    uses: ./.github/workflows/package-linux.yml

  packaging-contract-macos:
    name: Focused Native macOS Packaging Contracts
    needs: [change-classifier, code-health, quick]
    if: ${{ contains(fromJSON(needs.change-classifier.outputs.lanes), 'packaging-contract-macos') }}
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Run focused native macOS packaging contract nodes
        run: uv run --no-sync python -c "from scripts.verify import run_macos_packaging_contracts; run_macos_packaging_contracts()"

  fast-verification-gate:
    name: Qt6 Integration Verification Gate
    needs:
      - change-classifier
      - code-health
      - quick
      - qt6-verification
      - remaining-surface-verification
      - source-fast-targets
      - full-r-stack
      - windows-package-qualification
      - macos-package-qualification
      - linux-package-qualification
      - packaging-contract-macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required lane results
        shell: bash
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SELECTED_LANES: ${{ needs.change-classifier.outputs.lanes }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          required = {"change-classifier", "quick", "code-health"}
          if jobs["change-classifier"]["result"] == "success":
              required.update(json.loads(os.environ["SELECTED_LANES"]))
          failures = []
          for name in sorted(jobs.keys() | required):
              expected = "success" if name in required else "skipped"
              result = jobs.get(name, {}).get("result")
              print(f"{name}: {result} (expected {expected})")
              if result != expected:
                  failures.append(name)
          if failures:
              raise SystemExit("Verification gate failed: " + ", ".join(failures))
          PY
