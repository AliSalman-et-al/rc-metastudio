name: Package native macOS applications

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: macos-arm64
            architecture: arm64
            runner: macos-15
            artifact: RCMetaStudio-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked Python
        run: uv python install

      - name: Resolve package metadata
        id: package-metadata
        shell: bash
        run: uv run --no-project python scripts/resolve_package_ci_metadata.py

      - name: Resolve target contract
        shell: bash
        run: |
          set -euo pipefail
          target_values="$(python3 scripts/resolve_macos_package_target.py '${{ matrix.architecture }}' --format shell)"
          eval "$target_values"
          test "$delivery_target" = '${{ matrix.target }}'
          test "$runner" = '${{ matrix.runner }}'
          test "$artifact" = '${{ matrix.artifact }}'
          test "$(uname -m)" = "$machine"

      - name: Cache official Qt SDK
        id: macos_qt_sdk_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt-sdk
          key: qtbase-sdk-6.12.0-${{ matrix.target }}

      - name: Install official Qt SDK
        if: ${{ steps.macos_qt_sdk_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: uv tool run --from aqtinstall==3.3.0 aqt install-qt mac desktop 6.12.0 clang_64 --archives qtbase --outputdir "$PWD/build/qt-sdk"

      - name: Resolve official Qt rcc
        shell: bash
        run: uv run --no-project python scripts/macos_rcc.py --sdk-root "$PWD/build/qt-sdk/6.12.0/macos" --github-env "$GITHUB_ENV" --diagnostic "build/qt-sdk/${{ matrix.target }}-rcc.json"

      - name: Fingerprint macOS Qt build inputs
        id: macos-qt-build
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(
            {
              printf '%s\n' "$PWD" "${ImageVersion:-}"
              sw_vers -buildVersion
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-path
              cmake --version
              ninja --version
              uv --version
            } | shasum -a 256 | cut -d ' ' -f 1
          )"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache the source-built macOS Qt SDK
        id: macos-qt-build-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/macos-qt-source/install
            build/macos-qt-source/uv-cache
          key: macos-package-qt-${{ matrix.target }}-${{ steps.macos-qt-build.outputs.fingerprint }}-${{ hashFiles('scripts/build-macos-package.sh', 'config/macos-package-targets.json', '.python-version', 'pyproject.toml', 'uv.lock') }}

      - name: Build and run the first-green packaged workflow
        shell: bash
        env:
          RCMS_RUNNER_LABEL: ${{ matrix.runner }}
          RCMS_MACOS_QT_CACHE_HIT: ${{ steps.macos-qt-build-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          test ! -e /opt/X11
          bash scripts/package-macos.sh --architecture "${{ matrix.architecture }}" \
            --artifact-name "${{ matrix.artifact }}" \
            --archive-root-name "RCMetaStudio-${{ steps.package-metadata.outputs.version }}-${{ matrix.target }}"

      - name: Prune the macOS build wheel cache
        shell: bash
        run: |
          if [ -d build/macos-qt-source/uv-cache ]; then
            uv cache prune --ci --cache-dir build/macos-qt-source/uv-cache
          fi

      - name: Upload immutable unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload bring-up evidence and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-evidence
          path: |
            artifacts/${{ matrix.artifact }}-evidence.json
            artifacts/${{ matrix.artifact }}-archive-inspection.json
            build/macos-package/${{ matrix.architecture }}/work/qualification/**
            build/macos-package/${{ matrix.architecture }}/work/qualification/packaged-smoke*.log
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/warn-rc-metastudio-macos.txt
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/xref-rc-metastudio-macos.html
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/Analysis-00.toc
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/EXE-00.toc
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/COLLECT-00.toc
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/BUNDLE-00.toc
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
