name: Package native macOS applications

on:
  workflow_call:
    inputs:
      pr_wheels:
        description: Qualify prebuilt Qt wheels at their macOS 14.4 deployment floor.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      prepare_dependencies_only:
        description: Prepare the source-built Qt SDK and PyQt wheel for release builds.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: macos-arm64
            architecture: arm64
            runner: macos-15
            artifact: RCMetaStudio-macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_ARTIFACT: ${{ matrix.artifact }}${{ inputs.pr_wheels && '-pr-wheels' || '' }}
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-rcms
        with:
          qt-rcc: 'true'
          macos-package-r-cache: ${{ !inputs.prepare_dependencies_only }}
          uv-cache-suffix: macos-package-${{ inputs.pr_wheels && 'pr-wheels' || 'release' }}-${{ hashFiles('config/macos-package-targets.json', 'config/r-dependencies.json', 'scripts/configure_macos_r_launchers.py', '.python-version') }}

      - name: Resolve package metadata
        id: package-metadata
        shell: bash
        run: uv run --no-project python scripts/resolve_package_ci_metadata.py

      - name: Resolve target contract
        shell: bash
        run: |
          set -euo pipefail
          target_values="$(python3 scripts/resolve_macos_package_target.py '${{ matrix.architecture }}' --format shell)"
          eval "$target_values"
          test "$delivery_target" = '${{ matrix.target }}'
          test "$runner" = '${{ matrix.runner }}'
          test "$artifact" = '${{ matrix.artifact }}'
          test "$(uname -m)" = "$machine"

      - name: Fingerprint macOS Qt build inputs
        if: ${{ !inputs.pr_wheels }}
        id: macos-qt-build
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: uv run --no-project python scripts/macos_build_cache.py "$ARCHITECTURE"

      - name: Cache the source-built macOS Qt SDK
        if: ${{ !inputs.pr_wheels }}
        id: macos-qt-build-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/macos-qt-source/install
          key: macos-qt-sdk-${{ steps.macos-qt-build.outputs.sdk }}

      - name: Cache the source-built PyQt wheel
        if: ${{ !inputs.pr_wheels }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/macos-pyqt-cache
          key: macos-pyqt-wheel-${{ steps.macos-qt-build.outputs.wheel }}

      - name: Prepare macOS build dependencies
        if: inputs.prepare_dependencies_only
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          RCMS_MACOS_QT_CACHE_HIT: ${{ steps.macos-qt-build-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
          RCMS_MACOS_PYQT_CACHE: "true"
        run: bash scripts/build-macos-package.sh --architecture "$ARCHITECTURE" --prepare-qt-only

      - name: Build and run the first-green packaged workflow
        if: ${{ !inputs.prepare_dependencies_only }}
        shell: bash
        env:
          RCMS_RUNNER_LABEL: ${{ matrix.runner }}
          RCMS_MACOS_QT_CACHE_HIT: ${{ steps.macos-qt-build-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
          RCMS_MACOS_PYQT_CACHE: "true"
          RCMS_MACOS_PR_WHEELS: ${{ inputs.pr_wheels }}
        run: |
          set -euo pipefail
          test ! -e /opt/X11
          bash scripts/package-macos.sh --architecture "${{ matrix.architecture }}" \
            --artifact-name "$PACKAGE_ARTIFACT" \
            --archive-root-name "RCMetaStudio-${{ steps.package-metadata.outputs.version }}-${{ matrix.target }}"

      - name: Prune the macOS build wheel cache
        if: ${{ !inputs.pr_wheels }}
        shell: bash
        run: |
          if [ -d build/macos-pyqt-cache ]; then
            uv cache prune --ci --cache-dir build/macos-pyqt-cache
          fi

      - name: Upload immutable unsigned package
        if: ${{ !inputs.prepare_dependencies_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}
          path: artifacts/${{ env.PACKAGE_ARTIFACT }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload bring-up evidence and failure diagnostics
        if: ${{ always() && !inputs.prepare_dependencies_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT }}-evidence
          path: |
            artifacts/${{ env.PACKAGE_ARTIFACT }}-evidence.json
            artifacts/${{ env.PACKAGE_ARTIFACT }}-archive-inspection.json
            build/macos-package/${{ matrix.architecture }}/work/qualification/**
            build/macos-package/${{ matrix.architecture }}/work/qualification/packaged-smoke*.log
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/warn-rc-metastudio-macos.txt
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/xref-rc-metastudio-macos.html
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/Analysis-00.toc
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/EXE-00.toc
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/COLLECT-00.toc
            build/macos-package/${{ matrix.architecture }}/work/rc-metastudio-macos/BUNDLE-00.toc
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
