name: Capture v0.3.1 release-source golden baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-v031-release-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: v0.3.1 source harness with release-bundled R
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out capture workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check out pinned v0.3.1 source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v0.3.1
          path: build/release-source
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked Python
        run: uv python install 3.11.9

      - name: Capture release-source numerical and semantic results
        run: |
          .\scripts\capture_v031_release_source.ps1 `
            -ReleaseSourcePath "build\release-source" `
            -OutputPath "build\v031-release-source-capture"

      - name: Upload immutable capture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v031-release-source-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/v031-release-source-capture/baseline
            build/v031-release-source-capture/release-source-provenance.json
            build/v031-release-source-capture/capture.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
